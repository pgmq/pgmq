name: ⚙️ Release on GHCR, PGXN
on:
  push:
    # Release on semantic version tag.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
jobs:
  pgxn-release:
    if: github.repository == 'pgmq/pgmq'
    name: Release on PGXN
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    defaults:
      run:
        working-directory: ./pgmq-extension
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Bundle the Release
        run: make dist
      - name: Release on PGXN
        env:
          PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
          PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
        run: pgxn-release
  container-image-release:
    name: Build and push images
    uses: ./.github/workflows/images.yml
  docs-release:
    if: github.repository == 'pgmq/pgmq'
    name: Deploy versioned docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Get version from pgmq.control
        id: version
        working-directory: ./pgmq-extension
        run: |
          echo "TAG_VER=$(grep 'default_version' pgmq.control | cut -d "'" -f 2)" >> $GITHUB_OUTPUT
      - name: Deploy docs for release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run mike deploy --update-aliases ${{ steps.version.outputs.TAG_VER }} latest
          uv run mike set-default latest
          git push origin gh-pages
